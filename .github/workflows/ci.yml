name: CI/CD Pipeline - CardGameEngine

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test .NET Project
    runs-on: ubuntu-latest

    steps:
      # 1. Clona il repository sul runner di GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configura l'SDK di .NET 9.0
      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # 3. Ripristina le dipendenze usando la soluzione
      - name: Restore dependencies
        run: dotnet restore CardGameEngineSolution.sln

      # 4. Compila la soluzione in modalità Release
      - name: Build solution
        run: dotnet build CardGameEngineSolution.sln --configuration Release --no-restore

      # 5. NUOVO: Esegue automaticamente tutti i test unitari
      - name: Run unit tests
        run: dotnet test CardGameEngineSolution.sln --configuration Release --no-build

  docker-verify:
    name: Build & Push Docker Image to GHCR
    runs-on: ubuntu-latest
    needs: build-and-test

    permissions:
      contents: read
      packages: write

    steps:
      # 1. Clona il repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Normalizza il nome dell'immagine in minuscolo (requisito di Docker)
      - name: Set lowercase image name
        run: |
          LOWER_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=ghcr.io/${LOWER_REPO}/card-game-engine" >> $GITHUB_ENV

      # 3. Login automatico su GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Configura Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Build e Push dell'immagine con tag latest e SHA del commit
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}