name: CI/CD Pipeline - CardGameEngine

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build .NET Project
    runs-on: ubuntu-latest

    steps:
      # 1. Clona il repository sul runner di GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configura l'SDK di .NET 9.0
      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # 3. Ripristina le dipendenze NuGet
      - name: Restore dependencies
        run: dotnet restore CardGameEngine/CardGameEngine.csproj

      # 4. Compila il progetto in modalità Release
      - name: Build project
        run: dotnet build CardGameEngine/CardGameEngine.csproj --configuration Release --no-restore

  docker-verify:
    name: Verify Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test # Parte solo se la build .NET ha successo

    steps:
      # 1. Clona il repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configura Docker Buildx per la containerizzazione avanzata
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Esegue la build del Dockerfile per testare che non ci siano errori
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false # Non caricheremo l'immagine su un registry pubblico per ora, verifichiamo solo la build
          tags: card-game-engine:latest