name: CI/CD Pipeline - CardGameEngine

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test .NET Project
    runs-on: ubuntu-latest

    steps:
      # 1. Clona il repository sul runner di GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configura l'SDK di .NET 9.0
      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # 3. Ripristina le dipendenze usando la soluzione
      - name: Restore dependencies
        run: dotnet restore CardGameEngineSolution.sln

      # 4. Compila la soluzione in modalità Release
      - name: Build solution
        run: dotnet build CardGameEngineSolution.sln --configuration Release --no-restore

      # 5. NUOVO: Esegue automaticamente tutti i test unitari
      - name: Run unit tests
        run: dotnet test CardGameEngineSolution.sln --configuration Release --no-build

  docker-verify:
    name: Verify Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test # Parte solo se build e test hanno successo!

    steps:
      # 1. Clona il repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configura Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Esegue la build del Dockerfile di verifica
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: card-game-engine:latest